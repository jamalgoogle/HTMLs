<!DOCTYPE html>
<html>

<head>
   <title>Draw Input</title>
   <style>
      body {
         display: flex;
         justify-content: center;
         align-items: center;
         min-height: 100vh;
         margin: 0;
         background-color: #f0f0f0;
      }
      canvas {
         border: 2px solid #333;
         border-radius: 8px;
         background-color: white;
         box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
         width: 100vw;
         height: 100vh;
      }
   </style>
</head>

<body>
   <canvas id="myCanvas"></canvas>
   <script>
      const canvas = document.getElementById('myCanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function startDrawing(e) {
         isDrawing = true;
         [lastX, lastY] = [e.offsetX, e.offsetY]; // use destructuring assignment.
      }

      function draw(e) {
         if (!isDrawing) return;

         ctx.beginPath();
         ctx.moveTo(lastX, lastY);
         ctx.lineTo(e.offsetX, e.offsetY);
         ctx.strokeStyle = 'red';
         ctx.lineWidth = 3;
         ctx.stroke();
         [lastX, lastY] = [e.offsetX, e.offsetY]; // update lastX and lastY.
         console.log(lastX, lastY);
      }

      function stopDrawing() {
         isDrawing = false;
      }

      window.addEventListener('resize', () => {
         canvas.width = window.innerWidth;
         canvas.height = window.innerHeight;
      });

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing); // optional, stops drawing when mouse leaves canvas
      console.log(ctx)
   </script>
</body>

</html>
